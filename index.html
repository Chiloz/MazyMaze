<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Marble Maze 3D+</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a2f14">
<link rel="stylesheet" href="style.css">
<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
<div id="ui">
  <h1>Marble Maze 3D</h1>
  <div id="hud">
    <span>Lv <b id="level">1</b>/10</span>
    <span><b id="time">0.0</b>s</span>
    <select id="cam">
      <option value="follow">Follow</option>
      <option value="top">Top</option>
      <option value="side">Side</option>
      <option value="first">First-Person</option>
    </select>
  </div>
  <button id="tiltBtn">Enable Tilt</button>
</div>
<canvas id="game"></canvas>
<canvas id="mini"></canvas>
<div id="controls">
  <button id="resetBtn">Reset</button>
  <button id="nextBtn" hidden>Next</button>
</div>
<div id="win" hidden><h2>Level Complete!</h2><button id="continueBtn">Continue</button></div>
<script type="module" src="app.js"></script>
</body>
</html>
