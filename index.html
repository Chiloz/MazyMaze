<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Marble Maze</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a7f37">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="ui">
    <h1>Marble Maze</h1>
    <div id="hud">
      <span>Level: <b id="level">1</b>/10</span>
      <span>Time: <b id="time">0.0</b>s</span>
    </div>
    <button id="tiltBtn">Enable Tilt</button>
  </div>
  <canvas id="game" width="360" height="360"></canvas>
  <div id="controls">
    <p>Desktop: Arrow keys • Mobile: Tilt phone</p>
    <button id="resetBtn">Reset</button>
    <button id="nextBtn" hidden>Next Level</button>
  </div>
  <div id="winScreen" hidden>
    <h2>You Win!</h2>
    <p id="winText"></p>
    <button id="continueBtn">Continue</button>
  </div>
  <script src="app.js"></script>
</body>
</html>
